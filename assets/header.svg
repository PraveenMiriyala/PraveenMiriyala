<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 38px; font-weight: 800; fill: url(#text-grad); letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #94a3b8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; fill: #10b981; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="260" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="820" cy="40" r="120" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="100" cy="220" r="140" fill="#6366f1" opacity="0.10" filter="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="130" x2="900" y2="130" />
    <line x1="0" y1="195" x2="900" y2="195" />
    <line x1="225" y1="0" x2="225" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="675" y1="0" x2="675" y2="260" />
  </g>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="900" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Badge Pill: FOUNDER & ARCHITECT -->
  <g transform="translate(48, 38)">
    <rect width="210" height="26" rx="13" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" class="tag">FOUNDER @ CLIMBSIGNAL</text>
  </g>

  <!-- Main Name Header -->
  <text x="48" y="108" class="title">Praveen Miriyala</text>

  <!-- Subtitle / Positioning Statement -->
  <text x="48" y="136" class="subtitle">High-Performance WordPress Architect · Gutenberg Specialist · Technical SEO &amp; AI Systems</text>

  <!-- Bottom Metric Cards -->
  <g transform="translate(48, 172)">
    <!-- Card 1 -->
    <g>
      <rect width="180" height="58" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-opacity="0.6"/>
      <text x="16" y="26" class="stat-val">8+ Years</text>
      <text x="16" y="44" class="stat-label">Senior Craft &amp; Engineering</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(196, 0)">
      <rect width="180" height="58" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-opacity="0.6"/>
      <text x="16" y="26" class="stat-val">3,500+ Builds</text>
      <text x="16" y="44" class="stat-label">Production Deliveries</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(392, 0)">
      <rect width="180" height="58" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-opacity="0.6"/>
      <text x="16" y="26" class="stat-val">95+ Performance</text>
      <text x="16" y="44" class="stat-label">Core Web Vitals First</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(588, 0)">
      <rect width="216" height="58" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-opacity="0.6"/>
      <text x="16" y="26" class="stat-val">AI &amp; MCP Workflows</text>
      <text x="16" y="44" class="stat-label">Agentic SEO &amp; Tools</text>
    </g>
  </g>
</svg>